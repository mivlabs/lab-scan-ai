[project]
name = "lab-scan-ai"
version = "0.1.0"
description = "Прототип: ИИ читает бланки анализов и раскладывает показатели в карту пациента"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "pillow>=10",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends/File в аргументах по умолчанию
